name: Go

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000

          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              mode=merge-base
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              head="$GITHUB_SHA"
              mode=direct
              ;;
            *)
              echo "unsupported event: $EVENT_NAME" >&2
              exit 2
              ;;
          esac

          if [[ -z "$base" || "$base" == "$zero" ]]; then
            echo "missing usable base SHA for $EVENT_NAME" >&2
            exit 2
          fi

          git rev-parse --verify "${base}^{commit}"
          git rev-parse --verify "${head}^{commit}"

          if [[ "$mode" == merge-base ]]; then
            git diff --check "${base}...${head}"
          else
            git diff --check "$base" "$head"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download modules
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Run 32-bit commitment tests
        run: GOARCH=386 go test ./auth/commitment/kzg ./auth/commitment/ipa

      - name: Run verifier WASM conformance and Map-proof smoke
        run: sh scripts/test-verifier-wasm-vectors.sh

      - name: Run writer WASM smoke
        run: sh scripts/test-writer-wasm.sh

      - name: Build content-addressed WASM release assets
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-wasm-release.sh \
            "v0.0.0-ci.${GITHUB_SHA::12}" \
            "${RUNNER_TEMP}/malt-wasm-release"

      - name: Run vet
        run: go vet ./...

      - name: Build SDK packages
        run: make build
